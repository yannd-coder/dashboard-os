<!--
  V0.6 — Template HTML pour la génération de visuels M01.

  Placeholders (à substituer côté n8n avant POST à browserless) :
    {{FORMAT}}          → 'square' | 'story' | 'banner'
    {{PHOTO_URL}}       → URL publique Supabase Storage de la photo de fond
    {{ACCROCHE_HTML}}   → accroche (les "\n" doivent être convertis en "<br>" côté n8n)
    {{SUBTITLE_LINE1}}  → ex: "VILLA COLIVER"
    {{SUBTITLE_LINE2}}  → ex: "SAINT-PIERRE"

  Le logo Coliver est embarqué en base64 ci-dessous (200 KB) — pas besoin
  d'asset externe, le rendu est self-contained.

  Dimensions browserless à passer côté n8n :
    square  → 1080 × 1080
    story   → 1080 × 1920
    banner  → 1200 × 630
-->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Montserrat:wght@500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    .card {
      position: relative;
      overflow: hidden;
    }
    .card .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    .overlay {
      position: absolute;
      top: 0;
      bottom: 0;
      background: rgba(40, 40, 40, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }
    .accroche {
      font-family: 'Allura', cursive;
      color: #fff;
      text-align: center;
      line-height: 1.05;
      margin: 0;
      letter-spacing: 0;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.35);
      font-weight: 400;
    }
    .subtitle {
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      text-align: center;
      font-weight: 500;
      margin: 0;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
    }
    .subtitle .line { display: block; }
    .subtitle .line + .line { margin-top: 6px; }
    .logo { height: auto; display: block; }

    /* ===== Format carré 1080×1080 ===== */
    body.format-square .card { width: 1080px; height: 1080px; }
    body.format-square .overlay { left: 22%; width: 56%; padding: 60px 40px; }
    body.format-square .accroche { font-size: 130px; margin-bottom: 70px; }
    body.format-square .subtitle { font-size: 28px; margin-bottom: 40px; }
    body.format-square .logo { width: 180px; }

    /* ===== Format story 1080×1920 ===== */
    body.format-story .card { width: 1080px; height: 1920px; }
    body.format-story .overlay { left: 12%; width: 76%; padding: 100px 60px; }
    body.format-story .accroche { font-size: 160px; margin-bottom: 90px; }
    body.format-story .subtitle { font-size: 32px; margin-bottom: 50px; }
    body.format-story .logo { width: 220px; }

    /* ===== Format banner 1200×630 ===== */
    body.format-banner .card { width: 1200px; height: 630px; }
    body.format-banner .overlay { left: 18%; width: 64%; padding: 35px 30px; }
    body.format-banner .accroche { font-size: 88px; margin-bottom: 25px; line-height: 1; }
    body.format-banner .subtitle { font-size: 22px; margin-bottom: 22px; }
    body.format-banner .logo { width: 120px; }
  </style>
</head>

    <img class="bg" src="{{PHOTO_URL}}" alt="">
    <div class="overlay">
      <h1 class="accroche">{{ACCROCHE_HTML}}</h1>
