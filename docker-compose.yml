services:
  dashboard:
    build:
      context: .
      args:
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_N8N_WEBHOOK_URL: ${VITE_N8N_WEBHOOK_URL}
        VITE_N8N_WEBHOOK_SECRET: ${VITE_N8N_WEBHOOK_SECRET}
    image: yannos-dashboard:latest
    container_name: dashboard
    restart: unless-stopped
    networks:
      - dashboard-net
    ports:
      - "127.0.0.1:3000:80"

  caddy:
    image: caddy:2.8-alpine
    container_name: dashboard-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - dashboard-net
    extra_hosts:
      # Permet à Caddy d'atteindre n8n qui tourne sur l'host (port 5678)
      - "host.docker.internal:host-gateway"
    environment:
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
    depends_on:
      - dashboard

networks:
  dashboard-net:
    driver: bridge
    name: dashboard-net

volumes:
  caddy-data:
  caddy-config:
