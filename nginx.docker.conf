server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip (Caddy fera aussi du gzip côté edge, mais ça ne coûte rien)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript image/svg+xml;

    # SPA routing : toute route inconnue retourne index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets versionnés (Vite ajoute un hash dans le nom)
    location ~* \.(?:js|css|woff2?|png|svg|ico|jpe?g|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Pas de cache pour index.html (sinon les déploiements ne se voient pas)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Sécurité : pas d'exposition de la version Nginx
    server_tokens off;
}
