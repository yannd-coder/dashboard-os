name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH build + redeploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (git pull + docker compose build)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ ! -d "$APP_DIR" ] || [ ! -f "$APP_DIR/docker-compose.yml" ]; then
              echo "→ VPS_APP_DIR introuvable, auto-discovery"
              CANDIDATE=$(docker inspect dashboard --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' 2>/dev/null || true)
              if [ -n "$CANDIDATE" ] && [ -f "$CANDIDATE/docker-compose.yml" ]; then
                APP_DIR="$CANDIDATE"
              else
                for d in /root/dashboard /root/dashboard-os /opt/dashboard /opt/dashboard-os /root/yannos-dashboard; do
                  if [ -f "$d/docker-compose.yml" ]; then APP_DIR="$d"; break; fi
                done
              fi
              if [ ! -f "$APP_DIR/docker-compose.yml" ]; then
                echo "❌ Cannot locate dashboard repo. Candidates:"
                find / -name docker-compose.yml -path '*dashboard*' 2>/dev/null || true
                exit 1
              fi
            fi
            echo "→ APP_DIR=$APP_DIR"
            cd "$APP_DIR"

            echo "→ git pull origin main"
            git pull origin main

            echo "→ écriture .env depuis les secrets GitHub"
            cat > .env <<ENVEOF
            VITE_APP_NAME=${{ secrets.VITE_APP_NAME }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_N8N_WEBHOOK_URL=${{ secrets.VITE_N8N_WEBHOOK_URL }}
            VITE_N8N_WEBHOOK_SECRET=${{ secrets.N8N_WEBHOOK_SECRET }}
            N8N_WEBHOOK_SECRET=${{ secrets.N8N_WEBHOOK_SECRET }}
            BROWSERLESS_TOKEN=${{ secrets.BROWSERLESS_TOKEN }}
            ENVEOF
            chmod 600 .env

            echo "→ docker compose up -d --build"
            docker compose up -d --build

            echo "→ cleanup images dangling"
            docker image prune -f

            echo "→ état containers"
            docker compose ps

            echo "✅ Deploy terminé"
